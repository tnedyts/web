    <ellipse cx="200" cy="200" rx="62" ry="70" fill="url(#skin)"/>
    <ellipse cx="138" cy="208" rx="10" ry="16" fill="#e2a982"/>
    <ellipse cx="262" cy="208" rx="10" ry="16" fill="#e2a982"/>
    <!-- hair -->
    <path d="M136 196 C128 136 168 116 206 118 C248 120 272 150 266 196 C258 168 240 156 214 152 C196 160 170 160 150 154 C142 166 138 180 136 196Z" fill="#2b1f1a"/>
    <!-- beanie -->
    <path d="M138 168 C138 112 176 96 202 96 C232 96 266 116 264 168 Z" fill="#ff7a59"/>
    <rect x="132" y="158" width="138" height="22" rx="11" fill="#e85d3f"/>
    <circle cx="202" cy="92" r="12" fill="#ffc861"/>
    <!-- face -->
    <ellipse cx="178" cy="212" rx="6" ry="7" fill="#2b1f1a"/>
    <ellipse cx="224" cy="212" rx="6" ry="7" fill="#2b1f1a"/>
    <circle cx="180" cy="209" r="2" fill="#fff"/><circle cx="226" cy="209" r="2" fill="#fff"/>
    <path d="M168 196 q10 -6 20 0 M214 196 q10 -6 20 0" stroke="#2b1f1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
