    <radialGradient id="glow"><stop offset="0" stop-color="#ffc861" stop-opacity=".9"/><stop offset="1" stop-color="#ffc861" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><circle cx="200" cy="200" r="200"/></clipPath>
  </defs>
