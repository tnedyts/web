  <p class="doc__kicker">Мешканці глибин</p>
  <h1 class="doc__title">Хто живе <em>в темряві</em></h1>
  <p class="doc__lead">Вісім істот — від сутінкової зони до западин. Прокручуйте вниз: що нижче картка, то глибше живе її герой.</p>
