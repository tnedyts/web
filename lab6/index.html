<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Frameset//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-frameset.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="uk" lang="uk">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="description" content="Інформаційний сайт про історію, напрями та застосування ШІ" />
<meta name="author" content="Прізвище Ім'я По батькові" />
<title>Світ штучного інтелекту</title>
</head>
<!-- Варіант 3: ліва колонка | центр (верх + дві частини знизу) | права колонка -->
<frameset cols="17%, *, 20%">
  <!-- ліва колонка на всю висоту: головне меню -->
  <frame src="menu.html" name="menu" scrolling="no" noresize="noresize" frameborder="1" marginwidth="10" marginheight="10" />
  <!-- центральна частина: поділ по вертикалі -->
  <frameset rows="120, *">
    <!-- верхня смуга: логотип і назва сайту -->
    <frame src="logo.html" name="logo" scrolling="no" noresize="noresize" frameborder="1" marginwidth="0" marginheight="0" />
    <!-- нижня смуга: поділ по горизонталі на дві частини -->
    <frameset cols="28%, *">
      <frame src="topics.html" name="topics" scrolling="auto" frameborder="1" marginwidth="10" marginheight="10" />
      <frame src="home.html" name="content" scrolling="yes" frameborder="1" marginwidth="15" marginheight="10" />
    </frameset>
  </frameset>
  <!-- права колонка на всю висоту: цікаві факти -->
  <frame src="facts.html" name="facts" scrolling="auto" frameborder="1" marginwidth="10" marginheight="10" />
  <noframes>
    <body>
      <p>Ваш браузер не підтримує фрейми. Перейдіть на <a href="home.html">головну сторінку</a> сайту.</p>
    </body>
  </noframes>
</frameset>
</html>
